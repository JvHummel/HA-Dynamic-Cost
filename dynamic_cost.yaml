# Dynamic Cost tracking- https://github.com/JvHummel/HA-Dynamic-Cost
# 16JUL2026

###############################################################################
####                                                                       ####
####                             INPUT FIELDS                              ####
####                                                                       ####
###############################################################################

input_text:
  # Input text field to indicate which sensor returns the current import price
  # Required unit: €/kWh
  dynamic_cost_current_import_price_source:
    name: Dynamic Cost Current Import Price Source
    icon: mdi:currency-eur
    mode: text

  # Input text field to indicate which sensor returns the current export price
  # Required unit: €/kWh
  dynamic_cost_current_export_price_source:
    name: Dynamic Cost Current Export Price Source
    icon: mdi:currency-eur
    mode: text

  # Input text field to indicate which sensor returns the total energy import from grid
  # Required unit: kWh
  dynamic_cost_total_grid_import_source:
    name: Dynamic Cost Total Grid Import Source
    icon: mdi:transmission-tower-export
    mode: text

  # Input text field to indicate which sensor returns the total energy export to grid
  # Required unit: kWh
  dynamic_cost_total_grid_export_source:
    name: Dynamic Cost Total Grid Export Source
    icon: mdi:transmission-tower-import
    mode: text

  # Input text field to indicate which sensor returns the total energy produced by solar panels
  # Required unit: kWh
  dynamic_cost_total_solar_production_source:
    name: Dynamic Cost Total Solar Production Source
    icon: mdi:solar-power-variant
    mode: text

  # Input text field to indicate which sensor returns the total energy imported by batteries
  # In other words; how much energy was used to charge the batteries
  # Required unit: kWh
  dynamic_cost_total_battery_charge_source:
    name: Dynamic Cost Total Battery Charge Source
    icon: mdi:battery-plus
    mode: text

  # Input text field to indicate which sensor returns the total energy exported by batteries
  # In other words; how much energy was produced by discharging the batteries
  # Required unit: kWh
  dynamic_cost_total_battery_discharge_source:
    name: Dynamic Cost Total Battery Discharge Source
    icon: mdi:battery-minus
    mode: text

###############################################################################
####                                                                       ####
####                               TEMPLATES                               ####
####                                                                       ####
###############################################################################

# Update timing logic
#
# Because the templates in Home Assistant might not be updated in the order we want,
# this could affect data stability. I've seen glitches without the throttled/staggered
# approach. As such this package uses a combination of quarter-hourly utility meters
# and time-triggered templates. This ensures data stability regardless of template
# evaluation order.
#
# Throttled sensors get updated twice a minute. Once at xx:xx:15 and once at xx:xx:45
# After every such update, the templates for intermediate calculated energy flows (e.g.
# Solar to House, Solar to Battery, Grid to House, etc.) will be updated 5 seconds later
# based on the throttled sensors.
#
# These intermediate values are then added up for daily and lifetime totals.
#
# Intermediate calculations, such as Solar to House, Solar to Battery, Grid to House, etc.
# get updated

template:
  # Abstractions provided by sources
  - sensor:
    - name: "Dynamic Cost Current Import Price"
      unique_id: dynamic_cost_current_import_price
      state: "{{ states(states('input_text.dynamic_cost_current_import_price_source')) | float(0)}}"
      unit_of_measurement: "€/kWh"
  - sensor:
    - name: "Dynamic Cost Current Export Price"
      unique_id: dynamic_cost_current_export_price
      state: "{{ states(states('input_text.dynamic_cost_current_export_price_source')) | float(0)}}"
      unit_of_measurement: "€/kWh"
  - sensor:
    - name: "Dynamic Cost Total Grid Import"
      unique_id: dynamic_cost_total_grid_import
      state: "{{ states(states('input_text.dynamic_cost_total_grid_import_source')) | float(0)}}"
      unit_of_measurement: "kWh"
  - sensor:
    - name: "Dynamic Cost Total Grid Export"
      unique_id: dynamic_cost_total_grid_export
      state: "{{ states(states('input_text.dynamic_cost_total_grid_export_source')) | float(0)}}"
      unit_of_measurement: "kWh"
  - sensor:
    - name: "Dynamic Cost Total Solar Production"
      unique_id: dynamic_cost_total_solar_production
      state: "{{ states(states('input_text.dynamic_cost_total_solar_production_source')) | float(0)}}"
      unit_of_measurement: "kWh"
  - sensor:
    - name: "Dynamic Cost Total Battery Charge"
      unique_id: dynamic_cost_total_battery_charge
      state: "{{ states(states('input_text.dynamic_cost_total_battery_charge_source')) | float(0)}}"
      unit_of_measurement: "kWh"
  - sensor:
    - name: "Dynamic Cost Total Battery Discharge"
      unique_id: dynamic_cost_total_battery_discharge
      state: "{{ states(states('input_text.dynamic_cost_total_battery_discharge_source')) | float(0)}}"
      unit_of_measurement: "kWh"

  # Throttled sensors
  - triggers:
    - trigger: time_pattern
      seconds: 15
    - trigger: time_pattern
      seconds: 45
    sensor:
      - name: "Dynamic Cost Throttled Total Solar Production kWh"
        unique_id: dynamic_cost_throttled_total_solar_production
        state: "{{ states('sensor.dynamic_cost_total_solar_production') }}"
        unit_of_measurement: "kWh"
  - triggers:
    - trigger: time_pattern
      seconds: 15
    - trigger: time_pattern
      seconds: 45
    sensor:
      - name: "Dynamic Cost Throttled Total Grid Import"
        unique_id: dynamic_cost_throttled_total_grid_import
        state: "{{ states('sensor.dynamic_cost_total_grid_import') }}"
        unit_of_measurement: "kWh"
  - triggers:
    - trigger: time_pattern
      seconds: 15
    - trigger: time_pattern
      seconds: 45
    sensor:
      - name: "Dynamic Cost Throttled Total Grid Export"
        unique_id: dynamic_cost_throttled_total_grid_export
        state: "{{ states('sensor.dynamic_cost_total_grid_export') }}"
        unit_of_measurement: "kWh"
  - triggers:
    - trigger: time_pattern
      seconds: 15
    - trigger: time_pattern
      seconds: 45
    sensor:
      - name: "Dynamic Cost Throttled Total Battery Charge"
        unique_id: dynamic_cost_throttled_total_battery_charge
        state: "{{ states('sensor.dynamic_cost_total_battery_charge') }}"
        unit_of_measurement: "kWh"
  - triggers:
    - trigger: time_pattern
      seconds: 15
    - trigger: time_pattern
      seconds: 45
    sensor:
      - name: "Dynamic Cost Throttled Total Battery Discharge"
        unique_id: dynamic_cost_throttled_total_battery_discharge
        state: "{{ states('sensor.dynamic_cost_total_battery_discharge') }}"
        unit_of_measurement: "kWh"

  # Even the current price needs to be slightly delayed, skewed with respect to sensor data,
  # in order to stop the price change wrongly changing current period cumulative price.
  - triggers:
    - trigger: time_pattern
      seconds: 10
    sensor:
      - name: "Dynamic Cost Delayed Current Import Price"
        unique_id: dynamic_cost_delayed_current_import_price
        state: "{{ states('sensor.dynamic_cost_current_import_price') }}"
        unit_of_measurement: "€/kWh"
  - triggers:
    - trigger: time_pattern
      seconds: 10
    sensor:
      - name: "Dynamic Cost Delayed Current Export Price"
        unique_id: dynamic_cost_delayed_current_export_price
        state: "{{ states('sensor.dynamic_cost_current_export_price') }}"
        unit_of_measurement: "€/kWh"

  # Quarter-hourly energy flows
  - triggers:
    - trigger: time_pattern
      minutes: 0
      seconds: 5
    - trigger: time_pattern
      minutes: 14
      seconds: 50
    - trigger: time_pattern
      minutes: 15
      seconds: 5
    - trigger: time_pattern
      minutes: 29
      seconds: 50
    - trigger: time_pattern
      minutes: 30
      seconds: 5
    - trigger: time_pattern
      minutes: 44
      seconds: 50
    - trigger: time_pattern
      minutes: 45
      seconds: 5
    - trigger: time_pattern
      minutes: 59
      seconds: 50
    sensor:
      - name: "Dynamic Cost Quarter-hourly Energy Used in Home"
        unique_id: dynamic_cost_quarter_hourly_energy_used_in_home
        state: "{{ states('sensor.dynamic_cost_intermediate_house_energy_usage') }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        last_reset: "{{ now() }}"
  - triggers:
    - trigger: time_pattern
      minutes: 0
      seconds: 5
    - trigger: time_pattern
      minutes: 14
      seconds: 50
    - trigger: time_pattern
      minutes: 15
      seconds: 5
    - trigger: time_pattern
      minutes: 29
      seconds: 50
    - trigger: time_pattern
      minutes: 30
      seconds: 5
    - trigger: time_pattern
      minutes: 44
      seconds: 50
    - trigger: time_pattern
      minutes: 45
      seconds: 5
    - trigger: time_pattern
      minutes: 59
      seconds: 50
    sensor:
      - name: "Dynamic Cost Quarter-hourly Solar Usage in Home"
        unique_id: dynamic_cost_quarter_hourly_solar_usage_in_home
        state: "{{ states('sensor.dynamic_cost_intermediate_solar_to_home') }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        last_reset: "{{ now() }}"
  - triggers:
    - trigger: time_pattern
      minutes: 0
      seconds: 5
    - trigger: time_pattern
      minutes: 14
      seconds: 50
    - trigger: time_pattern
      minutes: 15
      seconds: 5
    - trigger: time_pattern
      minutes: 29
      seconds: 50
    - trigger: time_pattern
      minutes: 30
      seconds: 5
    - trigger: time_pattern
      minutes: 44
      seconds: 50
    - trigger: time_pattern
      minutes: 45
      seconds: 5
    - trigger: time_pattern
      minutes: 59
      seconds: 50
    sensor:
      - name: "Dynamic Cost Quarter-hourly Solar to Grid"
        unique_id: dynamic_cost_quarter_hourly_solar_to_grid
        state: "{{ states('sensor.dynamic_cost_intermediate_solar_to_grid') }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        last_reset: "{{ now() }}"
  - triggers:
    - trigger: time_pattern
      minutes: 0
      seconds: 5
    - trigger: time_pattern
      minutes: 14
      seconds: 50
    - trigger: time_pattern
      minutes: 15
      seconds: 5
    - trigger: time_pattern
      minutes: 29
      seconds: 50
    - trigger: time_pattern
      minutes: 30
      seconds: 5
    - trigger: time_pattern
      minutes: 44
      seconds: 50
    - trigger: time_pattern
      minutes: 45
      seconds: 5
    - trigger: time_pattern
      minutes: 59
      seconds: 50
    sensor:
      - name: "Dynamic Cost Quarter-hourly Solar to Battery"
        unique_id: dynamic_cost_quarter_hourly_solar_to_battery
        state: "{{ states('sensor.dynamic_cost_intermediate_solar_to_battery') }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        last_reset: "{{ now() }}"
  - triggers:
    - trigger: time_pattern
      minutes: 0
      seconds: 5
    - trigger: time_pattern
      minutes: 14
      seconds: 50
    - trigger: time_pattern
      minutes: 15
      seconds: 5
    - trigger: time_pattern
      minutes: 29
      seconds: 50
    - trigger: time_pattern
      minutes: 30
      seconds: 5
    - trigger: time_pattern
      minutes: 44
      seconds: 50
    - trigger: time_pattern
      minutes: 45
      seconds: 5
    - trigger: time_pattern
      minutes: 59
      seconds: 50
    sensor:
      - name: "Dynamic Cost Quarter-hourly Grid to House"
        unique_id: dynamic_cost_quarter_hourly_grid_to_house
        state: "{{ states('sensor.dynamic_cost_intermediate_grid_to_house') }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        last_reset: "{{ now() }}"
  - triggers:
    - trigger: time_pattern
      minutes: 0
      seconds: 5
    - trigger: time_pattern
      minutes: 14
      seconds: 50
    - trigger: time_pattern
      minutes: 15
      seconds: 5
    - trigger: time_pattern
      minutes: 29
      seconds: 50
    - trigger: time_pattern
      minutes: 30
      seconds: 5
    - trigger: time_pattern
      minutes: 44
      seconds: 50
    - trigger: time_pattern
      minutes: 45
      seconds: 5
    - trigger: time_pattern
      minutes: 59
      seconds: 50
    sensor:
      - name: "Dynamic Cost Quarter-hourly Grid to Battery"
        unique_id: dynamic_cost_quarter_hourly_grid_to_battery
        state: "{{ states('sensor.dynamic_cost_intermediate_grid_to_battery') }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        last_reset: "{{ now() }}"
  - triggers:
    - trigger: time_pattern
      minutes: 0
      seconds: 5
    - trigger: time_pattern
      minutes: 14
      seconds: 50
    - trigger: time_pattern
      minutes: 15
      seconds: 5
    - trigger: time_pattern
      minutes: 29
      seconds: 50
    - trigger: time_pattern
      minutes: 30
      seconds: 5
    - trigger: time_pattern
      minutes: 44
      seconds: 50
    - trigger: time_pattern
      minutes: 45
      seconds: 5
    - trigger: time_pattern
      minutes: 59
      seconds: 50
    sensor:
      - name: "Dynamic Cost Quarter-hourly Battery to Grid"
        unique_id: dynamic_cost_quarter_hourly_battery_to_grid
        state: "{{ states('sensor.dynamic_cost_intermediate_battery_to_grid') }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        last_reset: "{{ now() }}"
  - triggers:
    - trigger: time_pattern
      minutes: 0
      seconds: 5
    - trigger: time_pattern
      minutes: 14
      seconds: 50
    - trigger: time_pattern
      minutes: 15
      seconds: 5
    - trigger: time_pattern
      minutes: 29
      seconds: 50
    - trigger: time_pattern
      minutes: 30
      seconds: 5
    - trigger: time_pattern
      minutes: 44
      seconds: 50
    - trigger: time_pattern
      minutes: 45
      seconds: 5
    - trigger: time_pattern
      minutes: 59
      seconds: 50
    sensor:
      - name: "Dynamic Cost Quarter-hourly Battery to House"
        unique_id: dynamic_cost_quarter_hourly_battery_to_house
        state: "{{ states('sensor.dynamic_cost_intermediate_battery_to_house') }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        last_reset: "{{ now() }}"

  # Intermediate values (constantly updating) and the source for latched
  # time triggered templates
  - sensor:
    - name: "Dynamic Cost Intermediate House Energy Usage"
      unique_id: dynamic_cost_intermediate_house_energy_usage
      state: "{% set Solar = states('sensor.dynamic_cost_quarter_hourly_solar_production') | float %}
              {% set GridImport = states('sensor.dynamic_cost_grid_imported_quarter_hourly') | float %}
              {% set GridExport = states('sensor.dynamic_cost_grid_exported_quarter_hourly') | float %}
              {% set BatCharge = states('sensor.dynamic_cost_battery_charged_quarter_hourly') | float %}
              {% set BatDischarge = states('sensor.dynamic_cost_battery_discharged_quarter_hourly') | float %}
              {{ (Solar + GridImport + BatDischarge - BatCharge - GridExport) | round(3)  }}"
      unit_of_measurement: "kWh"
  - sensor:
    - name: "Dynamic Cost Intermediate Solar Usage in Home"
      unique_id: dynamic_cost_intermediate_solar_to_home
      state: "{% set Solar = states('sensor.dynamic_cost_quarter_hourly_solar_production') | float %}
              {% set GridExport = states('sensor.dynamic_cost_grid_exported_quarter_hourly') | float %}
              {% set BatDischarge = states('sensor.dynamic_cost_battery_discharged_quarter_hourly') | float %}
              {% set HomeUse = states('sensor.dynamic_cost_intermediate_house_energy_usage') | float %}

              {{ max(0, min(Solar - GridExport, HomeUse - BatDischarge)) | round(3) }}"
      unit_of_measurement: "kWh"
  - sensor:
    - name: "Dynamic Cost Intermediate Solar to Battery"
      unique_id: dynamic_cost_intermediate_solar_to_battery
      state: "{% set Solar = states('sensor.dynamic_cost_quarter_hourly_solar_production') | float %}
              {% set GridExport = states('sensor.dynamic_cost_grid_exported_quarter_hourly') | float %}
              {% set SolarToHouse = states('sensor.dynamic_cost_intermediate_solar_to_home') | float %}

              {{ max(0, Solar - GridExport - SolarToHouse) | round(3) }}"
      unit_of_measurement: "kWh"
  - sensor:
    - name: "Dynamic Cost Intermediate Grid to Battery"
      unique_id: dynamic_cost_intermediate_grid_to_battery
      state: "{% set BatCharge = states('sensor.dynamic_cost_battery_charged_quarter_hourly') | float %}
              {% set SolarToBattery = states('sensor.dynamic_cost_intermediate_solar_to_battery') | float %}
              {% set GridImport = states('sensor.dynamic_cost_grid_imported_quarter_hourly') | float %}
              {{ min(GridImport, BatCharge - SolarToBattery) | round(3) }}"
      unit_of_measurement: "kWh"
  - sensor:
    - name: "Dynamic Cost Intermediate Solar to Grid"
      unique_id: dynamic_cost_intermediate_solar_to_grid
      state: "{% set Solar = states('sensor.dynamic_cost_quarter_hourly_solar_production') | float %}
              {% set SolarToBat = states('sensor.dynamic_cost_intermediate_solar_to_battery') | float %}
              {% set SolarToHouse = states('sensor.dynamic_cost_intermediate_solar_to_home') | float %}

              {{ (Solar - SolarToBat - SolarToHouse) | round(3) }}"
      unit_of_measurement: "kWh"
  - sensor:
    - name: "Dynamic Cost Intermediate Grid to House"
      unique_id: dynamic_cost_intermediate_grid_to_house
      state: "{% set GridImport = states('sensor.dynamic_cost_grid_imported_quarter_hourly') | float %}
              {% set GridToBat = states('sensor.dynamic_cost_intermediate_grid_to_battery') | float %}

              {{ max(0, GridImport - GridToBat) | round(3) }}"
      unit_of_measurement: "kWh"
  - sensor:
    - name: "Dynamic Cost Intermediate Battery to House"
      unique_id: dynamic_cost_intermediate_battery_to_house
      state: "{% set HomeUse = states('sensor.dynamic_cost_intermediate_house_energy_usage') | float %}
              {% set GridToHouse = states('sensor.dynamic_cost_intermediate_grid_to_house') | float %}
              {% set SolarToHouse = states('sensor.dynamic_cost_intermediate_solar_to_home') | float %}

              {{ max(0, HomeUse - GridToHouse - SolarToHouse) | round(3) }}"
      unit_of_measurement: "kWh"
  - sensor:
    - name: "Dynamic Cost Intermediate Battery to Grid"
      unique_id: dynamic_cost_intermediate_battery_to_grid
      state: "{% set BatDischarge = states('sensor.dynamic_cost_battery_discharged_quarter_hourly') | float %}
              {% set BatteryToHouse = states('sensor.dynamic_cost_intermediate_battery_to_house') | float %}

              {{ max(0, BatDischarge - BatteryToHouse) | round(3) }}"
      unit_of_measurement: "kWh"

  ###
  # Total Energy Financials (templates)
  ###
  - sensor:
    - name: "Dynamic Cost Total Battery Savings"
      unique_id: dynamic_cost_total_battery_savings
      device_class: monetary
      state_class: total
      state: "{{ (states('sensor.dynamic_cost_lifetime_total_battery_to_grid_profits')  | float(0) +
                  states('sensor.dynamic_cost_lifetime_total_battery_to_house_savings') | float(0) -
                  states('sensor.dynamic_cost_lifetime_total_grid_to_battery_cost')     | float(0) -
                  states('sensor.dynamic_cost_lifetime_total_solar_to_battery_cost')    | float(0) -
                  states('sensor.dynamic_cost_lifetime_total_battery_to_grid_loss')     | float(0) -
                  states('sensor.dynamic_cost_lifetime_total_battery_to_house_loss')    | float(0) +
                  states('sensor.dynamic_cost_lifetime_total_grid_to_battery_profit')   | float(0) +
                  states('sensor.dynamic_cost_lifetime_total_solar_to_battery_profit')  | float(0)) | round(2) }}"
      unit_of_measurement: "€"

  - sensor:
    - name: "Dynamic Cost Total Solar Savings"
      unique_id: dynamic_cost_total_solar_savings
      device_class: monetary
      state_class: total
      state: "{{ (states('sensor.dynamic_cost_lifetime_total_solar_to_house_savings')  | float(0) +
                  states('sensor.dynamic_cost_lifetime_total_solar_to_grid_profits')   | float(0) +
                  states('sensor.dynamic_cost_lifetime_total_solar_to_battery_cost')   | float(0) -
                  states('sensor.dynamic_cost_lifetime_total_solar_to_house_loss')     | float(0) -
                  states('sensor.dynamic_cost_lifetime_total_solar_to_grid_loss')      | float(0) -
                  states('sensor.dynamic_cost_lifetime_total_solar_to_battery_profit') | float(0)) | round(2) }}"
      unit_of_measurement: "€"

  - sensor:
    - name: "Dynamic Cost Total Grid Cost"
      unique_id: dynamic_cost_total_grid_cost
      device_class: monetary
      state_class: total
      state: "{{ (states('sensor.dynamic_cost_lifetime_total_grid_import_cost')   | float(0) -
                  states('sensor.dynamic_cost_lifetime_total_grid_export_profit') | float(0) -
                  states('sensor.dynamic_cost_lifetime_total_grid_import_profit') | float(0) +
                  states('sensor.dynamic_cost_lifetime_total_grid_export_loss')   | float(0)) | round(2) }}"
      unit_of_measurement: "€"

  ###
  # Lifetime net totals per energy flow (savings/profit minus loss/cost)
  ###
  - sensor:
    - name: "Dynamic Cost Lifetime Solar to House Total"
      unique_id: dynamic_cost_lifetime_solar_to_house_total
      device_class: monetary
      state_class: total
      state: "{{ (states('sensor.dynamic_cost_lifetime_total_solar_to_house_savings') | float(0) -
                  states('sensor.dynamic_cost_lifetime_total_solar_to_house_loss')    | float(0)) | round(2) }}"
      unit_of_measurement: "€"

  - sensor:
    - name: "Dynamic Cost Lifetime Solar to Grid Total"
      unique_id: dynamic_cost_lifetime_solar_to_grid_total
      device_class: monetary
      state_class: total
      state: "{{ (states('sensor.dynamic_cost_lifetime_total_solar_to_grid_profits') | float(0) -
                  states('sensor.dynamic_cost_lifetime_total_solar_to_grid_loss')    | float(0)) | round(2) }}"
      unit_of_measurement: "€"

  - sensor:
    - name: "Dynamic Cost Lifetime Grid to Battery Total"
      unique_id: dynamic_cost_lifetime_grid_to_battery_total
      device_class: monetary
      state_class: total
      state: "{{ (states('sensor.dynamic_cost_lifetime_total_grid_to_battery_cost')    | float(0) -
                  states('sensor.dynamic_cost_lifetime_total_grid_to_battery_profit') | float(0)) | round(2) }}"
      unit_of_measurement: "€"

  - sensor:
    - name: "Dynamic Cost Lifetime Solar to Battery Total"
      unique_id: dynamic_cost_lifetime_solar_to_battery_total
      device_class: monetary
      state_class: total
      state: "{{ (states('sensor.dynamic_cost_lifetime_total_solar_to_battery_cost')    | float(0) -
                  states('sensor.dynamic_cost_lifetime_total_solar_to_battery_profit') | float(0)) | round(2) }}"
      unit_of_measurement: "€"

  - sensor:
    - name: "Dynamic Cost Lifetime Battery to House Total"
      unique_id: dynamic_cost_lifetime_battery_to_house_total
      device_class: monetary
      state_class: total
      state: "{{ (states('sensor.dynamic_cost_lifetime_total_battery_to_house_savings') | float(0) -
                  states('sensor.dynamic_cost_lifetime_total_battery_to_house_loss')    | float(0)) | round(2) }}"
      unit_of_measurement: "€"

  - sensor:
    - name: "Dynamic Cost Lifetime Battery to Grid Total"
      unique_id: dynamic_cost_lifetime_battery_to_grid_total
      device_class: monetary
      state_class: total
      state: "{{ (states('sensor.dynamic_cost_lifetime_total_battery_to_grid_profits') | float(0) -
                  states('sensor.dynamic_cost_lifetime_total_battery_to_grid_loss')    | float(0)) | round(2) }}"
      unit_of_measurement: "€"

  ###
  # Quarter-hourly financials
  #
  # Utility meters don't deal well with negative values, and net metering
  # would otherwise interfere with periodic resets. So import/export are
  # each split into a "cost/profit" template (price >= 0) and a
  # "loss/profit" template (price < 0), which are then accumulated
  # separately by the utility meters below.
  ###
  - sensor:
    - name: "Dynamic Cost Quarter-hourly Grid Import Cost"
      unique_id: dynamic_cost_quarter_hourly_grid_import_cost
      device_class: monetary
      state_class: total
      last_reset: "{{ now() }}"
      state: "{{ states('sensor.dynamic_cost_grid_imported_quarter_hourly') | float * [0, states('sensor.dynamic_cost_delayed_current_import_price') | float] | max }}"
      unit_of_measurement: "€"

  - sensor:
    - name: "Dynamic Cost Quarter-hourly Grid Import Profit"
      unique_id: dynamic_cost_quarter_hourly_grid_import_profit
      device_class: monetary
      state_class: total
      last_reset: "{{ now() }}"
      state: "{{ states('sensor.dynamic_cost_grid_imported_quarter_hourly') | float * [0, states('sensor.dynamic_cost_delayed_current_import_price') | float] | min | abs }}"
