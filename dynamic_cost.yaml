# Dynamic Cost tracking- https://github.com/JvHummel/HA-Dynamic-Cost
# V02052026

###############################################################################
####                                                                       ####
####                             INPUT FIELDS                              ####
####                                                                       ####
###############################################################################

input_text:
  # Input text field to indicate which sensor returns the current import price
  # Required unit: €/kWh
  dynamic_cost_current_import_price_source:
    name: Current Import Price Source
    icon: mdi:currency-eur
    mode: text

  # Input text field to indicate which sensor returns the current export price
  # Required unit: €/kWh
  dynamic_cost_current_export_price_source:
    name: Current Export Price Source
    icon: mdi:currency-eur
    mode: text

  # Input text field to indicate which sensor returns the total energy import from grid
  # Required unit: kWh
  dynamic_cost_total_grid_import_source:
    name: Total Grid Import Source
    icon: mdi:transmission-tower-export
    mode: text

  # Input text field to indicate which sensor returns the total energy export to grid
  # Required unit: kWh
  dynamic_cost_total_grid_export_source:
    name: Total Grid Export Source
    icon: mdi:transmission-tower-import
    mode: text

  # Input text field to indicate which sensor returns the total energy produced by solar panels
  # Required unit: kWh
  dynamic_cost_total_solar_production_source:
    name: Total Solar Production Source
    icon: mdi:solar-power-variant
    mode: text

  # Input text field to indicate which sensor returns the total energy imported by batteries
  # In other words; how much energy was used to charge the batteries
  # Required unit: kWh
  dynamic_cost_total_battery_charge_source:
    name: Total Battery Charge Source
    icon: mdi:battery-plus
    mode: text

  # Input text field to indicate which sensor returns the total energy exported by batteries
  # In other words; how much energy was produced by discharging the batteries
  # Required unit: kWh
  dynamic_cost_total_battery_discharge_source:
    name: Total Battery Discharge Source
    icon: mdi:battery-minus
    mode: text

###############################################################################
####                                                                       ####
####                               TEMPLATES                               ####
####                                                                       ####
###############################################################################

template:
  # Abstractions provided by sources
  - sensor:
      - name: "Current Import Price"
        unique_id: dynamic_cost_current_import_price
        state: "{{ states(states('input_text.dynamic_cost_current_import_price_source')) | float(0)}}"
        unit_of_measurement: "€/kWh"
  - sensor:
      - name: "Current Export Price"
        unique_id: dynamic_cost_current_export_price
        state: "{{ states(states('input_text.dynamic_cost_current_export_price_source')) | float(0)}}"
        unit_of_measurement: "€/kWh"
  - sensor:
      - name: "Total Grid Import"
        unique_id: dynamic_cost_total_grid_import
        state: "{{ states(states('input_text.dynamic_cost_total_grid_import_source')) | float(0)}}"
        unit_of_measurement: "kWh"
  - sensor:
      - name: "Total Grid Export"
        unique_id: dynamic_cost_total_grid_export
        state: "{{ states(states('input_text.dynamic_cost_total_grid_export_source')) | float(0)}}"
        unit_of_measurement: "kWh"
  - sensor:
      - name: "Total Solar Production"
        unique_id: dynamic_cost_total_solar_production
        state: "{{ states(states('input_text.dynamic_cost_total_solar_production_source')) | float(0)}}"
        unit_of_measurement: "kWh"
  - sensor:
      - name: "Total Battery Charge"
        unique_id: dynamic_cost_total_battery_charge
        state: "{{ states(states('input_text.dynamic_cost_total_battery_charge_source')) | float(0)}}"
        unit_of_measurement: "kWh"
  - sensor:
      - name: "Total Battery Discharge"
        unique_id: dynamic_cost_total_battery_discharge
        state: "{{ states(states('input_text.dynamic_cost_total_battery_discharge_source')) | float(0)}}"
        unit_of_measurement: "kWh"
  - triggers:
      - trigger: time_pattern
        seconds: 15
      - trigger: time_pattern
        seconds: 45
    sensor:
      - name: "Throttled Daily Solar Production kWh"
        unique_id: ThrotDailySolarProd
        state: "{{ states('sensor.daily_solar_kwh_stable') }}"
        unit_of_measurement: "kWh"
  - triggers:
      - trigger: time_pattern
        seconds: 15
      - trigger: time_pattern
        seconds: 45
    sensor:
      - name: "Throttled P1 Import"
        unique_id: ThrotP1Import
        state: "{{ states('sensor.dsmr_total_import_abstraction') }}"
        unit_of_measurement: "kWh"
  - triggers:
      - trigger: time_pattern
        seconds: 15
      - trigger: time_pattern
        seconds: 45
    sensor:
      - name: "Throttled P1 Export"
        unique_id: ThrotP1Export
        state: "{{ states('sensor.dsmr_total_export_abstraction') }}"
        unit_of_measurement: "kWh"
  - triggers:
      - trigger: time_pattern
        seconds: 15
      - trigger: time_pattern
        seconds: 45
    sensor:
      - name: "Throttled Batteries Export"
        unique_id: ThrotBatExport
        state: "{{ states('sensor.battery_export_total') }}"
        unit_of_measurement: "kWh"
  - triggers:
      - trigger: time_pattern
        seconds: 15
      - trigger: time_pattern
        seconds: 45
    sensor:
      - name: "Throttled Batteries Import"
        unique_id: ThrotBatImport
        state: "{{ states('sensor.batterij_import_total') }}"
        unit_of_measurement: "kWh"
  - triggers:
      - trigger: time_pattern
        seconds: 10
    sensor:
      - name: "Delayed Import Price"
        unique_id: DelayImportPrice
        state: "{{ states('sensor.current_import_cost_abstraction') }}"
        unit_of_measurement: "€/kWh"
  - triggers:
      - trigger: time_pattern
        seconds: 10
    sensor:
      - name: "Delayed Export Price"
        unique_id: DelayExportPrice
        state: "{{ states('sensor.current_export_cost_abstraction') }}"
        unit_of_measurement: "€/kWh"
  - triggers:
      - trigger: time_pattern
        minutes: 0
        seconds: 5
      - trigger: time_pattern
        minutes: 59
        seconds: 50
    sensor:
      - name: "Hourly Energy Used in Home"
        unique_id: ThrotHourlyEnergyUsedinHome
        state: "{{ states('sensor.intermediate_hourly_energy_used_in_home') }}"
        unit_of_measurement: "kWh"
  - triggers:
      - trigger: time_pattern
        minutes: 0
        seconds: 5
      - trigger: time_pattern
        minutes: 59
        seconds: 50
    sensor:
      - name: "Hourly Solar Usage in Home"
        unique_id: ThrotHourlySolarHomeUsage
