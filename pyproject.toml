[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
# N = pep8-naming. This is the rule set that enforces snake_case functions and
# variables; Home Assistant runs it on every integration.

[tool.ruff.lint.per-file-ignores]
# Planting points quote the integration's code verbatim, long lines included.
"scripts/mutation_check.py" = ["E501"]
