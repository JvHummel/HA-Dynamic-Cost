name: Release

# Push a tag like v0.1.1 (matching "version" in manifest.json) to publish a
# release. A tag with a suffix, like v0.2.0-beta.1, becomes a pre-release,
# which HACS only offers to users who opted into betas.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches manifest.json
        run: |
          manifest_version=$(python3 -c "import json; print(json.load(open('custom_components/dynamic_cost/manifest.json'))['version'])")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest.json version $manifest_version. Bump the version, commit, and tag that commit."
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "Dynamic Cost $GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease
